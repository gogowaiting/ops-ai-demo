name: ops-ai

services:
  ops-ai:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.3.0}
    image: ops-ai-demo:${TAG:-dev}
    ports:
      - "${WEB_PORT:-8765}:8765"
    environment:
      OPS_ENVIRONMENT: ${OPS_ENVIRONMENT:-production}
      OPS_TOOLS_MODE: ${OPS_TOOLS_MODE:-real}
      OPS_DB_BACKEND: ${OPS_DB_BACKEND:-sqlite}
      OPS_DB_URL: ${OPS_DB_URL:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      LOKI_URL: ${LOKI_URL:-}
      K8S_CONTEXT: ${K8S_CONTEXT:-docker-desktop}
      K8S_NAMESPACE: ${K8S_NAMESPACE:-default}
      # OpenAI：配置后走在线模型与在线向量化，留空则离线降级
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      # Ollama：LLM_PROVIDER=ollama EMBED_PROVIDER=ollama docker compose up
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      # 可选：配置后要求 Alertmanager webhook 携带 Bearer token
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      OPS_WEB_AUTH_MODE: ${OPS_WEB_AUTH_MODE:-none}
      OPS_WEB_API_TOKEN: ${OPS_WEB_API_TOKEN:-}
      OPS_WEB_API_USER: ${OPS_WEB_API_USER:-}
      OPS_WEB_API_ROLES: ${OPS_WEB_API_ROLES:-operator}
      OPS_WEB_IDENTITY_HEADER: ${OPS_WEB_IDENTITY_HEADER:-X-User}
      OPS_WEB_ROLES_HEADER: ${OPS_WEB_ROLES_HEADER:-X-Roles}
      # 会话 checkpoint 落盘（SqliteSaver），重启容器不丢会话与审批暂停态
      CHECKPOINT_DB: /app/data/checkpoints.sqlite
      APPROVAL_AUDIT_DB: /app/data/approvals.sqlite
      ALERT_JOB_DB: /app/data/alert_jobs.sqlite
      DIAGNOSTIC_TRACE_DB: /app/data/traces.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 向量索引持久化，避免容器重建后重新向量化
      - rag_index:/app/.rag_index
      # 会话 checkpoint 持久化
      - checkpoint_data:/app/data
      # 宿主机 kubeconfig（只读），用于容器内操作 Docker Desktop 集群
      - ${HOME}/.kube:/home/app/.kube:ro
    restart: unless-stopped

volumes:
  rag_index:
  checkpoint_data:
