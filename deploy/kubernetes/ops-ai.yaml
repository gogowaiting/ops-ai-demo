apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-ai
  labels:
    app.kubernetes.io/name: ops-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-ai-config
  labels:
    app.kubernetes.io/name: ops-ai
data:
  OPS_ENVIRONMENT: production
  OPS_TOOLS_MODE: real
  PROMETHEUS_URL: https://prometheus.example.com
  LOKI_URL: https://loki.example.com
  K8S_CONTEXT: ""
  K8S_NAMESPACE: default
  LLM_PROVIDER: ollama
  EMBED_PROVIDER: ollama
  OLLAMA_BASE_URL: http://ollama:11434/v1
  OLLAMA_MODEL: qwen3:8b
  OLLAMA_EMBED_MODEL: bge-m3
  CHECKPOINT_DB: /app/data/checkpoints.sqlite
  APPROVAL_AUDIT_DB: /app/data/approvals.sqlite
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ops-ai-data
  labels:
    app.kubernetes.io/name: ops-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ops-ai-rag
  labels:
    app.kubernetes.io/name: ops-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-ai
  labels:
    app.kubernetes.io/name: ops-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-ai
    spec:
      serviceAccountName: ops-ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops-ai
          image: ops-ai-demo:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - configMapRef:
                name: ops-ai-config
            - secretRef:
                name: ops-ai-secrets
                optional: true
          env:
            - name: KUBECONFIG
              value: /home/app/.kube/config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: rag
              mountPath: /app/.rag_index
            - name: tmp
              mountPath: /tmp
            - name: kubeconfig
              mountPath: /home/app/.kube
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ops-ai-data
        - name: rag
          persistentVolumeClaim:
            claimName: ops-ai-rag
        - name: tmp
          emptyDir: {}
        - name: kubeconfig
          secret:
            secretName: ops-ai-kubeconfig
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ops-ai
  labels:
    app.kubernetes.io/name: ops-ai
spec:
  selector:
    app.kubernetes.io/name: ops-ai
  ports:
    - name: http
      port: 8765
      targetPort: http
